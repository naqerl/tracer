{{define "app-page"}}
<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head"}}
    <title>{{.AppName}} - Tracer</title>
</head>
<body>
    <div class="max-w-5xl mx-auto p-6">
        {{template "navbar" .Nav}}

        <!-- Recent Logs Container - Lazy loaded with polling -->
        <div hx-get="/analytics/{{.CollectorName}}/apps/{{.AppName}}/logs" hx-trigger="load once, every 30s" hx-swap="outerHTML">
            <div class="bg-bg-secondary p-5">
                <h2 class="text-lg font-medium mb-4">Recent Logs</h2>
                <p class="text-fg-secondary text-center py-4">Loading logs...</p>
            </div>
        </div>
    </div>

</body>
</html>
{{end}}

{{define "app-logs"}}
<div class="bg-bg-secondary p-5">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-medium">Recent Logs</h2>
        <a href="/analytics/{{.CollectorName}}/apps/{{.AppName}}/logs" class="text-accent hover:underline text-sm">View All &rarr;</a>
    </div>
    {{if .Grouped}}
    <div class="space-y-2">
        {{range .Grouped}}
        <div class="bg-bg p-3 border border-bg-secondary hover:border-accent/50 transition-colors">
            <div class="flex items-start justify-between">
                <div class="flex-1">
                    <span class="text-sm">{{.Message}}</span>
                </div>
                <span class="ml-3 px-2 py-0.5 text-xs bg-bg-secondary rounded">{{.Count}}</span>
            </div>
        </div>
        {{end}}
    </div>
    {{else}}
    <p class="text-fg-secondary text-center py-4">No recent logs</p>
    {{end}}
</div>
{{end}}
