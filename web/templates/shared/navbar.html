{{define "navbar"}}
<nav class="flex justify-between items-center mb-6 pb-4 border-b border-bg-secondary">
    <div class="flex gap-2">
        <a href="/analytics/" class="px-3 py-1.5 text-fg-secondary hover:text-fg transition-colors {{if eq .ActivePage "analytics"}}text-accent{{end}}">Analytics</a>
        <a href="/settings/" class="px-3 py-1.5 text-fg-secondary hover:text-fg transition-colors {{if eq .ActivePage "settings"}}text-accent{{end}}">Settings</a>
    </div>
    <div class="flex gap-3 items-center">
        <span class="text-fg-secondary text-sm">{{.Username}}</span>
        <form action="/logout" method="POST">
            <button type="submit" class="p-1.5 hover:bg-bg-secondary transition-colors text-fg-secondary hover:text-fg" title="Logout">
                {{template "icon-logout"}}
            </button>
        </form>
    </div>
</nav>
{{end}}

{{define "navbar-styles"}}{{end}}
