name: Gatekeeper

# Copy-paste setup: checkout + gatekeeper. CI is untouched; gatekeeper fetches
# that workflow's logs for this commit via the Forgejo Actions API and waits
# until it finishes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to review'
        required: true
        type: number

concurrency:
  group: gatekeeper-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: debian-agent
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
      || github.event.pull_request.head.repo.full_name == ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: review
        name: Review
        uses: https://git.naqerl.com/actions/gatekeeper@main
        with:
          agent-api-key: ${{ secrets.AGENT_API_KEY }}
          agent-model: ${{ vars.AGENT_MODEL }}
          agent-provider-url: ${{ vars.AGENT_PROVIDER_URL }}
          pat: ${{ secrets.AGENT_PAT }}
          post-comment: "true"
          pr-number: ${{ inputs.pr-number || '' }}
          ci-workflow: ci.yml
          gods: |
            - naqerl
          bot: yao

      - name: Enforce review result
        if: always()
        env:
          R: ${{ steps.review.outputs.passed }}
          F: ${{ steps.review.outputs.report }}
        run: |
          if [ "$R" = "true" ]; then
            echo "Review passed."
            exit 0
          fi
          echo "::error::PR review failed — ${F}. Manual attention required."
          exit 1
