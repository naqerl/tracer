name: PR Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to review'
        required: true
        type: number

concurrency:
  group: pr-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: debian-agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GATEKEEPER_PAT }}

      - name: Install Go
        run: |
          echo "Installing Go 1.26.4..."
          curl -fsSL "https://go.dev/dl/go1.26.4.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"

      - uses: https://git.naqerl.com/actions/gatekeeper@main
        with:
          agent-api-key: ${{ secrets.AGENT_API_KEY }}
          agent-model: ${{ vars.AGENT_MODEL }}
          agent-provider-url: ${{ vars.AGENT_PROVIDER_URL }}
          account-username: gatekeeper
          account-email: gatekeeper@naqerl.com
          account-pat: ${{ secrets.GATEKEEPER_PAT }}
          mention: yao
          pr-number: ${{ inputs.pr-number || '' }}
          gods: |
            - naqerl
