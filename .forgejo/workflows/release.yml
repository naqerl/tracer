# Release workflow for tracer
#
# Builds tracer-collector and tracer-panel binaries for linux/amd64.
# On tag push (v*), builds, creates a release, and pushes Docker image.

name: Release

on:
  push:
    tags: ["v*"]

env:
  BINARY_COLLECTOR: tracer-collector
  BINARY_PANEL: tracer-panel

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Go ──────────────────────────────────────────────────────
      - name: Install Go
        run: |
          echo "Installing Go 1.26.4..."
          curl -fsSL "https://go.dev/dl/go1.26.4.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"

      - name: Download dependencies
        run: |
          go mod download

      - name: Vet (fmt + vet + staticcheck)
        run: |
          make vet

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make build
          ls -lh bin/

      - name: Test
        run: |
          go test ./...

     - uses: actions/forgejo-release@v2.12.1
        with:
          direction: upload
          release-dir: bin/

      - name: Install Docker CLI
        run: |
          apt-get update && apt-get install -y curl
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.0.3.tgz | tar -xz -C /tmp
          mv /tmp/docker/docker /usr/local/bin/
          rm -rf /tmp/docker

      - name: Build panel image
        run: |
          docker build \
            -t git.naqerl.com/naqerl/tracer-panel:${{ github.ref_name }} \
            -t git.naqerl.com/naqerl/tracer-panel:latest \
            -f apps/panel/Dockerfile \
            .

      - name: Log in to Forgejo Container Registry
        run: |
          echo "${{ secrets.PACKAGE_PAT }}" | \
            docker login git.naqerl.com -u "${{ github.actor }}" --password-stdin

      - name: Push panel image
        run: |
          docker push git.naqerl.com/naqerl/tracer-panel:${{ github.ref_name }}
          docker push git.naqerl.com/naqerl/tracer-panel:latest
