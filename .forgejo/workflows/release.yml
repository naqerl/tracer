name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          set -e
          echo "=== Checking out ==="
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          curl -sL "https://git.naqerl.com/api/v1/repos/naqerl/eco_tracer/archive/${GITHUB_REF_NAME:-main}.tar.gz" -o /tmp/repo.tar.gz
          ls -lh /tmp/repo.tar.gz
          mkdir -p /tmp/checkout
          tar -C /tmp/checkout -xzf /tmp/repo.tar.gz
          ls -la /tmp/checkout/
          echo "=== Moving files ==="
          mkdir -p "${GITHUB_WORKSPACE}"
          mv /tmp/checkout/*/* "${GITHUB_WORKSPACE}/"
          cd "${GITHUB_WORKSPACE}"
          ls -la

      - name: List files
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Files ==="
          ls -la
          echo "=== Makefile exists? ==="
          test -f Makefile && echo "YES" || echo "NO"
