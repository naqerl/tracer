name: Evolve

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  evolve:
    runs-on: debian-agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.EVOLVE_PAT }}

      - name: Configure git identity
        run: |
          git config user.name evolver
          git config user.email evolver@naqerl.com

      - name: Install Go
        run: |
          echo "Installing Go 1.26.4..."
          curl -fsSL "https://go.dev/dl/go1.26.4.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"

      - uses: https://git.naqerl.com/actions/evolve@main
        with:
          agent-api-key: ${{ secrets.AGENT_API_KEY }}
          agent-model: ${{ vars.AGENT_MODEL }}
          agent-provider-url: ${{ vars.AGENT_PROVIDER_URL }}
          account-username: evolver
          account-email: evolver@naqerl.com
          account-pat: ${{ secrets.EVOLVE_PAT }}
          workflow-name: "reply.yml,gatekeeper.yml"
