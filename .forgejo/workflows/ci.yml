name: CI

on:
  # pull_request as well as push: a run must exist for the head commit of a PR
  # even when nobody pushed to the branch again.
  pull_request:
    types: [opened, synchronize, reopened]
  # Only the default branch. pull_request already covers every head commit that
  # has a PR; push covers main alone, where there is no PR event at all.
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        run: |
          echo "Installing Go 1.26.8..."
          curl -fsSL "https://go.dev/dl/go1.26.8.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"

      - name: Test
        run: make test
