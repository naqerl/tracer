# Release for tracer.
#
# Triggered by a tag push (`v*`). It builds the two binaries, attaches them to a
# GitHub release, and publishes both container images to GitHub Container
# Registry, tagged with the tag name. The cluster pulls the panel image from
# ghcr.io, so a tag is the only way an image reaches production.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make build
          ls -lh bin/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            bin/tracer-collector bin/tracer-panel bin/checksums.txt \
            --title "${{ github.ref_name }}" \
            --notes "Images:
          - ${{ env.REGISTRY }}/${{ env.OWNER }}/tracer-panel:${{ github.ref_name }}
          - ${{ env.REGISTRY }}/${{ env.OWNER }}/tracer-demo:${{ github.ref_name }}" \
            --verify-tag

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push panel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/panel/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tracer-panel:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tracer-panel:latest

      - name: Build and push demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tracer-demo:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tracer-demo:latest
