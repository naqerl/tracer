{{define "app"}}
<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head"}}
    <title>{{.AppName}} - Tracer</title>
    <style>
        .uplot { margin: 1.5rem 0; touch-action: pan-y pinch-zoom; }
        .range-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .range-tab {
            padding: 0.5rem 1rem;
            background: #1E1E1E;
            color: #EEEEEE;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            font-size: 0.875rem;
        }
        .range-tab:hover { background: #2A2A2A; }
        .range-tab.active { background: #5C9CF5; color: #0A0A0A; font-weight: 600; }
        @media (max-width: 640px) {
            .range-tab { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    {{template "navbar" .}}
    <div class="max-w-5xl mx-auto p-6">
        <!-- Stats Summary -->
        <h2 class="text-lg font-medium mb-4">Overview</h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-bg-secondary p-4 text-center">
                <div class="text-2xl font-bold">{{.Stats.Total}}</div>
                <div class="text-xs text-fg-secondary">Total Logs</div>
            </div>
            <div class="bg-bg-secondary p-4 text-center">
                <div class="text-2xl font-bold text-red-400">{{.Stats.Errors}}</div>
                <div class="text-xs text-fg-secondary">Errors</div>
            </div>
            <div class="bg-bg-secondary p-4 text-center">
                <div class="text-2xl font-bold text-yellow-400">{{.Stats.Warnings}}</div>
                <div class="text-xs text-fg-secondary">Warnings</div>
            </div>
            <div class="bg-bg-secondary p-4 text-center">
                <div class="text-2xl font-bold text-blue-400">{{.Stats.Infos}}</div>
                <div class="text-xs text-fg-secondary">Info</div>
            </div>
        </div>

        <div
          hx-get="/panel/collectors/{{.Collector}}/apps/{{.App}}/logs/groups"
          hx-trigger="load"
          hx-include="[name='since']"
        ></div>
</body>
</html>
{{end}}
