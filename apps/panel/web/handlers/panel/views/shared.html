{{define "log-message"}}
<div class="mb-2">
    <span class="inline-block w-2 h-2 rounded-full mr-3 mt-2{{if eq .Level `error`}} bg-red-500{{else if eq .Level `warn`}} bg-yellow-500{{else if eq .Level `info`}} bg-blue-500{{else}} bg-fg-secondary{{end}}"></span>
    <span class="text-xl font-medium break-all">{{.Message}}</span>
</div>
{{end}}

{{define "uptime-bars"}}
{{$bars := .Bars}}
{{$size := default "md" .Size}}
{{if $bars}}
<div class="flex items-end {{if eq $size `sm`}}gap-1{{else}}gap-px sm:gap-1{{end}}">
  {{range $bars}}
  <div
    class="{{.Class}} box-border rounded-sm {{if eq $size `sm`}}h-6 w-2{{else}}h-8 sm:h-12 flex-1 min-w-1 sm:min-w-2{{end}}"
    title="{{.Title}}"
    aria-label="{{.Title}}"
  ></div>
  {{end}}
</div>
{{else}}
<div class="text-xs text-fg-secondary">No uptime samples in range</div>
{{end}}
{{end}}
