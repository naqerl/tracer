{{define "navbar"}}
<nav class="flex items-center justify-between px-4 py-3 border-b border-bg-secondary" aria-label="Main navigation">
  <div class="flex gap-6" id="nav-links">
    <a href="/panel/" class="text-lg font-medium hover:text-fg transition-colors" data-nav="panel">/panel</a>
    <a href="/settings/" class="text-lg font-medium hover:text-fg transition-colors" data-nav="settings">/settings</a>
  </div>

  <form class="flex items-center gap-1 text-sm" onsubmit="return false;">
    <div class="relative group" id="since-dropdown">
      <div class="flex items-center justify-between gap-1 px-2 py-1 border border-transparent group-hover:border-bg-secondary text-fg-secondary group-hover:text-fg transition-colors cursor-pointer w-[5.5rem]">
        <span class="flex items-center gap-1">
          <span>since</span>
          <span id="since-label">{{default "24h" .Since}}</span>
        </span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div id="since-options" class="hidden group-hover:block absolute left-0 right-0 top-full mt-0 bg-bg border-x border-b border-bg-secondary shadow-lg z-50">
        <button type="button" class="block w-full text-left px-2 py-1.5 text-sm hover:bg-bg-secondary transition-colors" onclick="navbarSelectSince('1h')">1h</button>
        <button type="button" class="block w-full text-left px-2 py-1.5 text-sm hover:bg-bg-secondary transition-colors" onclick="navbarSelectSince('6h')">6h</button>
        <button type="button" class="block w-full text-left px-2 py-1.5 text-sm hover:bg-bg-secondary transition-colors" onclick="navbarSelectSince('24h')">24h</button>
        <button type="button" class="block w-full text-left px-2 py-1.5 text-sm hover:bg-bg-secondary transition-colors" onclick="navbarSelectSince('7d')">7d</button>
        <button type="button" class="block w-full text-left px-2 py-1.5 text-sm hover:bg-bg-secondary transition-colors" onclick="navbarSelectSince('30d')">30d</button>
      </div>
    </div>
  </form>
  <script>
    (function() {
      const cookieName = 'tracer_panel_since';
      const defaultSince = '24h';
      const allowedSince = new Set(['1h', '6h', '24h', '7d', '30d']);

      function readCookie(name) {
        const prefix = name + '=';
        const parts = document.cookie.split(';');
        for (let i = 0; i < parts.length; i++) {
          const cookie = parts[i].trim();
          if (cookie.startsWith(prefix)) {
            return decodeURIComponent(cookie.slice(prefix.length));
          }
        }
        return '';
      }

      function writeCookie(name, value) {
        let cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=31536000; SameSite=Lax';
        if (window.location.protocol === 'https:') {
          cookie += '; Secure';
        }
        document.cookie = cookie;
      }

      const currentSince = readCookie(cookieName);
      const since = allowedSince.has(currentSince) ? currentSince : defaultSince;
      if (currentSince !== since) {
        writeCookie(cookieName, since);
      }
      const sinceLabel = document.getElementById('since-label');
      sinceLabel.textContent = since;
      document.documentElement.dataset.since = since;

      const path = window.location.pathname;
      document.querySelectorAll('#nav-links a').forEach(function(link) {
        const nav = link.getAttribute('data-nav');
        const isActive =
          (nav === 'panel' && path === '/panel/') ||
          (nav === 'settings' && path === '/settings/');
        if (isActive) {
          link.classList.remove('text-fg-secondary');
        } else {
          link.classList.add('text-fg-secondary');
        }
      });

      window.navbarSelectSince = function(val) {
        if (!allowedSince.has(val)) {
          return;
        }
        writeCookie(cookieName, val);
        sinceLabel.textContent = val;
        document.documentElement.dataset.since = val;
        window.location.reload();
      };

      function reloadIfSinceChanged() {
        const activeSince = allowedSince.has(readCookie(cookieName)) ? readCookie(cookieName) : defaultSince;
        const pageSince = document.documentElement.dataset.since || sinceLabel.textContent || defaultSince;
        if (activeSince !== pageSince) {
          window.location.reload();
        }
      }

      window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
          reloadIfSinceChanged();
        }
      });

      window.addEventListener('popstate', function() {
        reloadIfSinceChanged();
      });

      document.body.addEventListener('htmx:historyRestore', function() {
        reloadIfSinceChanged();
      });
    })();
  </script>
</nav>
{{end}}
