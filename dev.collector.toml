# Tracer Collector Configuration (development)

name = "local-dev"
panel_endpoint = "ws://localhost:18080/api/ws/ingest"
stats_interval = "30s"
data_dir = "/tmp/tracer-data"

[[apps]]
name = "mock-app"
path = "/tmp/tracer-mock.log"
format = "json"
timestamp_field = "timestamp"
timestamp_format = "2006-01-02T15:04:05Z07:00"
level_field = "level"
trace_id_field = "trace_id"
message_field = "message"
