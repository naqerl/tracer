session_name: tracer-dev
start_directory: .
windows:
  - window_name: panel
    panes:
      - shell_command:
          - exec make dev-panel
  - window_name: mock-logger
    panes:
      - shell_command:
          - exec make dev-genlog
  - window_name: collector
    panes:
      - shell_command:
          - exec make dev-collector
