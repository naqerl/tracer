root = "/workspace"
tmp_dir = "/tmp/air-collector"

[build]
cmd = "go build -o /tmp/tracer-collector ./apps/collector/cmd/tracer-collector"
bin = "/tmp/tracer-collector"
include_ext = ["go", "toml", "tmpl"]
exclude_dir = [".git", "tmp", "vendor", "node_modules"]
delay = 500
stop_on_error = true

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"
