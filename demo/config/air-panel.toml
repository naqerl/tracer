root = "/workspace"
tmp_dir = "/tmp/air-panel"

[build]
cmd = "go build -o /tmp/tracer-panel ./apps/panel/cmd/tracer-panel"
bin = "/tmp/tracer-panel"
include_ext = ["go", "html", "tmpl", "toml"]
exclude_dir = [".git", "tmp", "vendor", "node_modules"]
delay = 500
stop_on_error = true

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"
