server {
    listen 8081 default_server;
    server_name _;

    # Read-only gate: reject every state-changing method before proxying.
    # Session routes (/auth/*), WebSocket upgrades, the read-only format
    # preview (/panel/*/apps/preview), and app create/update/delete
    # (/panel/*/apps and /panel/*/apps/*) are exempt so a visitor can log in,
    # the collector can stream data, the add-app form can guess formats, and
    # saved apps can be managed.
    set $tracer_block 0;
    if ($request_method !~ ^(GET)$) {
        set $tracer_block 1;
    }
    if ($request_uri ~ ^/auth/) {
        set $tracer_block 0;
    }
    if ($request_uri ~ ^/panel/.+/apps(preview|/[^/]+)?$) {
        set $tracer_block 0;
    }
    if ($tracer_block = 1) {
        return 405;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade proxying.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
